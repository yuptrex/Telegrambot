services:
  - type: web
    name: battle-arena-bot
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: SEASON_ANCHOR_DATE
        value: "2026-01-01"
      - key: PORT
        value: "3000"
